// ===== wasm-bindgen glue (inlined by build.sh) =====

        script_src = new URL(document.currentScript.src, location.href).toString();
    }

    /**
     * Stateful input method. JS keeps one instance per text field.
     *
     * Each call that can finish syllables returns the *committed* text; the
     * in-progress syllable is read with [`HangulIme::preedit`].
     */
    class HangulIme {
        __destroy_into_raw() {
            const ptr = this.__wbg_ptr;
            this.__wbg_ptr = 0;

const W = () => wasm_bindgen;

let ime = null;           // wasm_bindgen.HangulIme
let hangul = true;        // 한/영 mode
let comp = null;          // preedit range in the textarea: { start, len }
let internal = false;     // true while we modify the textarea ourselves
let vShift = false;       // on-screen Shift (one-shot)

// ------------------------------------------------------------------
// Textarea editing
// ------------------------------------------------------------------
function replaceRange(start, end, text) {
  internal = true;
  try {
    ta.setSelectionRange(start, end);
    // execCommand keeps the browser's undo stack; setRangeText is the fallback
    const ok = text ? document.execCommand("insertText", false, text)
                    : (start === end || document.execCommand("delete", false));
    if (!ok || ta.value.slice(start, start + text.length) !== text) {
      ta.setRangeText(text, start, end, "end");
    }
  } finally { internal = false; }
}

function typeChar(ch) { feed(() => ime.key(ch)); }
function typeJamo(ch) { feed(() => ime.jamo(ch)); }

function feed(step) {
  let start, end;
  if (comp) { start = comp.start; end = comp.start + comp.len; }
  else { start = ta.selectionStart; end = ta.selectionEnd; }
  const commit = step();
  const pre = ime.preedit();
  replaceRange(start, end, commit + pre);
  const s = start + commit.length;
  comp = pre ? { start: s, len: pre.length } : null;
  ta.setSelectionRange(s + pre.length, s + pre.length);
  update();
}

function backspace() {
  // 1) shrink the syllable being composed
  if (comp && ime.backspace()) {
    const pre = ime.preedit();
    replaceRange(comp.start, comp.start + comp.len, pre);
    comp = pre ? { start: comp.start, len: pre.length } : null;
    const c = comp ? comp.start + comp.len : ta.selectionStart;
    ta.setSelectionRange(c, c);
    update();
    return true;
  }
  flush();
  // 2) re-open the committed character before the caret, jamo by jamo
  const pos = ta.selectionStart;
  const n = pos === ta.selectionEnd && pos > 0 ? ime.reopenTail(ta.value.slice(Math.max(0, pos - 3), pos)) : 0;
  if (n) {
    const pre = ime.preedit();
    replaceRange(pos - n, pos, pre);
    comp = pre ? { start: pos - n, len: pre.length } : null;
    const c = pos - n + pre.length;
    ta.setSelectionRange(c, c);
    update();
    return true;
  }
  return false; // let the browser delete (non-Hangul, selection, …)
}

function flush() {
  if (!ime) return;
  ime.flush();          // text is already in the textarea
  if (comp) { comp = null; update(); }
}

// ------------------------------------------------------------------
// Rendering: preedit highlight (mirror), jamo slots, stats
// ------------------------------------------------------------------
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function renderMirror() {
  const v = ta.value;
  let html;
  if (comp) {
    html = esc(v.slice(0, comp.start)) + "<mark>" + esc(v.slice(comp.start, comp.start + comp.len)) + "</mark>" + esc(v.slice(comp.start + comp.len));
  } else {
    html = esc(v);
  }
  mirror.innerHTML = html + "​";
  mirror.style.width = ta.clientWidth + "px";
  mirror.style.height = ta.clientHeight + "px";
  mirror.scrollTop = ta.scrollTop;
}

function setSlot(el, v) { el.querySelector("b").textContent = v; el.classList.toggle("on", !!v); }

function update() {
  renderMirror();
  if (ime) {
    setSlot($("sCho"), ime.cho); setSlot($("sJung"), ime.jung); setSlot($("sJong"), ime.jong);
    const pre = ime.preedit();
    $("sOut").textContent = pre || (hangul ? "—" : "EN");
    $("sOut").classList.toggle("empty", !pre);
  }
  const v = ta.value;
  const syl = (v.match(/[\uAC00-\uD7A3]|[\u1100-\u115F\uA960-\uA97F][\u1160-\u11A7\uD7B0-\uD7C6]/g) || []).length;
  $("stats").innerHTML = `<b>${[...v].length.toLocaleString()}</b>자 · 한글 <b>${syl.toLocaleString()}</b>음절`;
  try { localStorage.setItem("han-text", v); } catch {}
}

// ------------------------------------------------------------------
// Keyboard events
// ------------------------------------------------------------------
function setMode(ko) {
  flush();
  hangul = ko;
  $("modeKo").setAttribute("aria-pressed", ko);
  $("modeEn").setAttribute("aria-pressed", !ko);
  renderKeyboard();
  update();
}

// Physical key → character, independent of Caps Lock and OS layout (두벌식 is positional)
function charFromEvent(e) {
  const m = /^Key([A-Z])$/.exec(e.code || "");
  if (m) return e.shiftKey ? m[1] : m[1].toLowerCase();
  return e.key;
}

ta.addEventListener("keydown", (e) => {
  if (!ime) return;
  if (e.isComposing || e.keyCode === 229) return;              // OS IME is active — stay out of its way
  if (e.code === "Lang1" || e.key === "HangulMode" || e.key === "Hangul" || (e.shiftKey && e.code === "Space") || e.code === "AltRight") {
    e.preventDefault(); setMode(!hangul); return;
  }
  if (e.altKey && /^Digit[123]$/.test(e.code)) { e.preventDefault(); setTab(+e.code.slice(5) - 1); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) { flush(); return; }  // shortcuts (copy, undo, …)
  if (!hangul) { flush(); return; }

  if (e.key === "Backspace") {
    if (backspace()) e.preventDefault();
    return;
  }
  if (e.key.length === 1) {
    e.preventDefault();
    const ch = charFromEvent(e);
    typeChar(vShift && /^[a-z]$/.test(ch) ? ch.toUpperCase() : ch);
    if (vShift) setVShift(false);
    return;
  }
  flush();  // Enter, Tab, arrows, Delete, Home/End … keep browser behaviour
});

ta.addEventListener("input", () => { if (!internal) { if (ime) ime.flush(); comp = null; update(); } });
ta.addEventListener("mousedown", flush);
ta.addEventListener("blur", flush);
ta.addEventListener("paste", flush);
ta.addEventListener("cut", flush);
ta.addEventListener("compositionstart", flush);
ta.addEventListener("scroll", () => { mirror.scrollTop = ta.scrollTop; });
new ResizeObserver(renderMirror).observe(ta);

// highlight physical keys on the on-screen keyboard
addEventListener("keydown", (e) => {
  const k = document.querySelector(`.key[data-code="${e.code}"]`);
  if (k) k.classList.add("down");
  if (e.key === "Shift") renderKeyboard(true);
});
addEventListener("keyup", (e) => {
  const k = document.querySelector(`.key[data-code="${e.code}"]`);
  if (k) k.classList.remove("down");
  if (e.key === "Shift") renderKeyboard(false);
});
addEventListener("blur", () => { document.querySelectorAll(".key.down").forEach((k) => k.classList.remove("down")); renderKeyboard(false); });

// ------------------------------------------------------------------
// On-screen 두벌식 keyboard
// ------------------------------------------------------------------
const ROWS = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
const VOWELS = "yuiophjklbnm";
let shiftShown = false;

function setVShift(on) { vShift = on; renderKeyboard(); }

function renderKeyboard(physShift) {
  if (typeof physShift === "boolean") shiftShown = physShift;
  const shift = shiftShown || vShift;
  const kb = $("kb");
  kb.replaceChildren();
  ROWS.forEach((row, ri) => {
    const r = document.createElement("div"); r.className = "row";
    if (ri === 2) r.append(fnKey("Shift", "ShiftLeft", "⇧ Shift", vShift, () => setVShift(!vShift)));
    for (const c of row) {
      const ch = shift ? c.toUpperCase() : c;
      const jamo = ime ? wasm_bindgen.jamoForKey(ch) : "";
      const b = document.createElement("button");
      b.type = "button";
      b.className = "key " + (VOWELS.includes(c) ? "vowel" : "cons") + (shift && jamo !== (ime ? wasm_bindgen.jamoForKey(c) : "") ? " shifted" : "");
      b.dataset.code = "Key" + c.toUpperCase();
      b.innerHTML = `<span class="l">${c}</span><span class="j">${hangul ? jamo : ch}</span>`;
      b.title = `${c.toUpperCase()} → ${jamo}`;
      b.addEventListener("mousedown", (e) => e.preventDefault());  // keep textarea focus
      b.addEventListener("click", () => {
        ta.focus();
        if (!hangul) { flush(); replaceRange(ta.selectionStart, ta.selectionEnd, ch); update(); }
        else typeChar(ch);
        if (vShift) setVShift(false);
      });
      r.append(b);
    }
    if (ri === 2) r.append(fnKey("Backspace", "Backspace", "⌫", false, () => {
      ta.focus();
      if (!(hangul && backspace())) {
        const s = ta.selectionStart, e2 = ta.selectionEnd;
        if (s !== e2) replaceRange(s, e2, "");
        else if (s > 0) replaceRange(s - [...ta.value.slice(0, s)].pop().length, s, "");
        update();
      }
    }));
    kb.append(r);
  });
  const r = document.createElement("div"); r.className = "row";
  r.append(fnKey("Lang", "Lang1", hangul ? "한/영 · 한" : "한/영 · A", false, () => { setMode(!hangul); ta.focus(); }, "wide"));
  r.append(fnKey("Space", "Space", "Space", false, () => { ta.focus(); hangul ? typeChar(" ") : (replaceRange(ta.selectionStart, ta.selectionEnd, " "), update()); }, "space"));
  r.append(fnKey("Enter", "Enter", "⏎ Enter", false, () => { ta.focus(); flush(); replaceRange(ta.selectionStart, ta.selectionEnd, "\n"); update(); }, "wide"));
  kb.append(r);
}

// 옛한글 on-screen keys: groups and letters come from the Rust tables (oldjamo.rs)
function keyLabel(ch) {
  const u = ch.codePointAt(0);
  if (u === 0x302E || u === 0x302F) return "\u25CC" + ch;                       // 방점 on a dotted circle
  if ((u >= 0x11A8 && u <= 0x11FF) || (u >= 0xD7CB && u <= 0xD7FB)) return "\u115F\u1160" + ch; // 종성 only: show in the final slot
  if ((u >= 0x1160 && u <= 0x11A7) || (u >= 0xD7B0 && u <= 0xD7C6)) return "\u115F" + ch;         // 중성: on a 초성 filler
  return ch;
}

// tab 2 = 겹낱자 닿소리; tab 3 = everything else, in this order
const TAB_OF = { "겹낱자 닿소리": 1 };
const TAB3_ORDER = ["홑낱자 닿소리", "홑낱자 홀소리", "겹낱자 홀소리", "방점", "그 밖의 옛 낱자"];

function renderOldKeys() {
  const groups = W().oldGroups().split("\n").map((line) => line.split("\t"));
  const byTitle = Object.fromEntries(groups);
  const make = ([title, letters]) => {
    const g = document.createElement("div"); g.className = "group";
    const h = document.createElement("span"); h.textContent = `${title} · ${[...letters].length}`;
    const keys = document.createElement("div"); keys.className = "keys";
    keys.append(...[...letters].map((ch) => {
      const forms = W().oldForms(ch);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "okey " + (forms === "중성" ? "vowel" : forms === "방점" ? "mark" : "cons");
      b.textContent = keyLabel(ch);
      b.title = `U+${ch.codePointAt(0).toString(16).toUpperCase()} · ${forms}`;
      b.addEventListener("mousedown", (e) => e.preventDefault());  // keep textarea focus
      b.addEventListener("click", () => { ta.focus(); typeJamo(ch); });
      return b;
    }));
    g.append(h, keys);
    return g;
  };
  const tab2 = groups.filter(([t]) => TAB_OF[t] === 1);
  const tab3 = [...TAB3_ORDER.filter((t) => byTitle[t] != null).map((t) => [t, byTitle[t]]),
                ...groups.filter(([t]) => TAB_OF[t] !== 1 && !TAB3_ORDER.includes(t))];
  $("old1").replaceChildren(...tab2.map(make));
  $("old2").replaceChildren(...tab3.map(make));
  const count = (gs) => gs.reduce((n, [, l]) => n + [...l].length, 0);
  $("cnt1").textContent = count(tab2);
  $("cnt2").textContent = count(tab3);
}

// ------------------------------------------------------------------
// 옛한글 web font: faces live in hanfont.wasm (Rust); registered via FontFace
// ------------------------------------------------------------------
let webFont = null;
async function loadWebFont() {
  const msg = $("fontMsg");
  try {
    const res = await fetch("hanfont.wasm?v=c3840cd6bf82");
    if (!res.ok) throw new Error("HTTP " + res.status);
    let inst;
    try { inst = (await WebAssembly.instantiateStreaming(res.clone(), {})).instance; }
    catch { inst = (await WebAssembly.instantiate(await res.arrayBuffer(), {})).instance; }
    const ex = inst.exports;
    // read ptr/len first: the first call may grow wasm memory and detach an earlier `memory.buffer`
    const blob = (id) => { const ptr = ex.blob_ptr(id), len = ex.blob_len(id); return new Uint8Array(ex.memory.buffer, ptr, len).slice(); };
    const meta = JSON.parse(new TextDecoder().decode(blob(0)));
    let bytes = 0;
    for (const face of meta.faces) {
      const data = blob(face.id);
      bytes += data.length;
      const ff = new FontFace(meta.family, data, { weight: face.weight, unicodeRange: meta.unicodeRange, display: "swap" });
      document.fonts.add(await ff.load());
    }
    const license = URL.createObjectURL(new Blob([blob(meta.licenseId)], { type: "text/plain;charset=utf-8" }));
    msg.innerHTML = `옛한글 웹 글꼴 적용됨 — ${meta.source} · ${(bytes / 1024).toFixed(0)}KB (hanfont.wasm) · <a href="${license}" target="_blank" rel="noopener">라이선스</a>`;
    $("fontInfo").classList.add("ok");
    webFont = meta.family;
    renderMirror();
  } catch (err) {
    msg.textContent = "옛한글 웹 글꼴을 불러오지 못해 시스템 글꼴을 사용합니다 (" + err.message + ")";
  }
}

function fnKey(name, code, label, on, onClick, extra = "wide") {
  const b = document.createElement("button");
  b.type = "button";
  b.className = `key fn ${extra}${on ? " on" : ""}`;
  b.dataset.code = code;
  b.innerHTML = `<span class="j">${label}</span>`;
  b.addEventListener("mousedown", (e) => e.preventDefault());
  b.addEventListener("click", onClick);
  return b;
}

let toastTimer;
function toast(msg, err = false) {
  const t = $("toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast" + (err ? " err" : "")), 2000);
}

$("btnConvert").addEventListener("mousedown", (e) => e.preventDefault());
$("btnConvert").onclick = () => {
  flush();
  let s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e) { s = 0; e = ta.value.length; }            // no selection → whole text
  const out = wasm_bindgen.convert(ta.value.slice(s, e));
  replaceRange(s, e, out);
  ta.setSelectionRange(s, s + out.length);
  update();
  toast("영문 → 한글 변환 완료");
};
$("btnSample").addEventListener("mousedown", (e) => e.preventDefault());
$("btnSample").onclick = () => {
  flush();
  if (ta.value && ta.value !== SAMPLE && !confirm("지금 내용을 예제문으로 바꿀까요?")) return;
  ta.focus(); replaceRange(0, ta.value.length, SAMPLE);
  ta.setSelectionRange(0, 0); ta.scrollTop = 0;
  update();
};
// ------------------------------------------------------------------
// PNG export: all Hangul is decomposed to conjoining jamo (Rust) and drawn with the
// embedded 옛한글 web font, so the image looks right even where no Korean font exists
// ------------------------------------------------------------------
const logoImg = new Image();

function graphemes(s) {
  if (typeof Intl !== "undefined" && Intl.Segmenter) return [...new Intl.Segmenter("ko", { granularity: "grapheme" }).segment(s)].map((x) => x.segment);
  return [...s];
}

function wrapText(ctx, text, maxW) {
  const out = [];
  for (const para of text.split("\n")) {
    let line = "";
    for (const tok of para.split(/(\s+)/)) {
      if (!tok) continue;
      if (ctx.measureText(line + tok).width <= maxW) { line += tok; continue; }
      if (line.trim()) { out.push(line.trimEnd()); line = ""; }
      if (/^\s+$/.test(tok)) continue;
      for (const g of graphemes(tok)) {                      // never split a syllable block
        if (line && ctx.measureText(line + g).width > maxW) { out.push(line); line = ""; }
        line += g;
      }
    }
    out.push(line.trimEnd());
  }
  return out;
}

async function exportPng() {
  flush();
  let s = ta.selectionStart, e = ta.selectionEnd;
  let text = (s !== e ? ta.value.slice(s, e) : ta.value).replace(/\s+$/, "");
  if (!text) return toast("내보낼 글이 없습니다", true);
  const D = (t) => W().decomposeAll(t);
  const HAN = `${webFont ? `"${webFont}", ` : ""}"Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  if (webFont) { try { await document.fonts.load(`30px "${webFont}"`, "\u1112\u1161\u11AB"); } catch {} }

  const Wd = 1400, P = 64, FS = 30, LH = Math.round(FS * 1.75), headH = 132, footH = 70, scale = 2;
  const m = document.createElement("canvas").getContext("2d");
  m.font = `400 ${FS}px ${HAN}`;
  const lines = wrapText(m, D(text), Wd - P * 2);
  const H = Math.min(headH + lines.length * LH + footH + 20, 16000);

  const cv = document.createElement("canvas");
  cv.width = Wd * scale; cv.height = H * scale;
  const ctx = cv.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, Wd, H);
  const g = ctx.createLinearGradient(0, 0, Wd, 0);
  g.addColorStop(0, "#06b6d4"); g.addColorStop(1, "#7c3aed");
  ctx.fillStyle = g; ctx.fillRect(0, 0, Wd, 6);
  if (logoImg.complete && logoImg.naturalWidth) {
    ctx.save(); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(P, 36, 56, 56, 14) : ctx.rect(P, 36, 56, 56); ctx.clip();
    ctx.drawImage(logoImg, P, 36, 56, 56); ctx.restore();
  }
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#0f172a"; ctx.font = `700 24px ${HAN}`; ctx.fillText("HAN", P + 74, 62);
  ctx.fillStyle = "#64748b"; ctx.font = `400 15px ${HAN}`; ctx.fillText(D("새 누리에 새 글쇠를 쓰는 그대에게"), P + 74, 88);
  ctx.textAlign = "right"; ctx.fillStyle = "#94a3b8"; ctx.font = `400 13px ${HAN}`;
  ctx.fillText(new Date().toISOString().slice(0, 10), Wd - P, 70);
  ctx.textAlign = "left";

  ctx.fillStyle = "#0f172a"; ctx.font = `400 ${FS}px ${HAN}`;
  let y = headH + FS;
  for (const ln of lines) {
    if (y > H - footH) break;
    ctx.fillText(ln, P, y);
    y += LH;
  }
  ctx.fillStyle = "#e5e8f0"; ctx.fillRect(P, H - footH + 10, Wd - P * 2, 1);
  ctx.fillStyle = "#94a3b8"; ctx.font = `400 12px ${HAN}`;
  ctx.fillText(D("글꼴: Noto Sans CJK KR (SIL OFL 1.1) · 옛한글 웹 글꼴로 그림"), P, H - footH + 40);

  const name = `han_${new Date().toISOString().slice(0, 10)}.png`;
  cv.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
  toast(`${name} 저장${s !== e ? " (선택한 부분)" : ""}`);
}
$("btnPng").addEventListener("mousedown", (e) => e.preventDefault());
$("btnPng").onclick = () => exportPng().catch((err) => toast(err.message, true));

$("btnCopy").onclick = async () => {
  flush();
  try { await navigator.clipboard.writeText(ta.value); toast("복사했습니다"); }
  catch { ta.select(); document.execCommand("copy"); toast("복사했습니다"); }
};
$("btnClear").onclick = () => {
  flush();
  if (!ta.value || confirm("입력한 내용을 모두 지울까요?")) { ta.focus(); replaceRange(0, ta.value.length, ""); update(); }
};
$("modeKo").onclick = () => { setMode(true); ta.focus(); };
$("modeEn").onclick = () => { setMode(false); ta.focus(); };

$("btnTheme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("han-theme", root.dataset.theme); } catch {}
};
try { const t = localStorage.getItem("han-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

// ------------------------------------------------------------------
// Boot
// ------------------------------------------------------------------
(async () => {
  try {
    await wasm_bindgen({ module_or_path: "han.wasm?v=cca3e48da5d3" });
  } catch (err) {
    $("sub").textContent = "han.wasm을 불러오지 못했습니다 — 웹 서버(http://)로 열어 주세요";
    $("sub").style.color = "#ef4444";
    toast("han.wasm 로드 실패: " + err.message, true);
    return;
  }
  // logo lives inside han.wasm
  const logoUrl = URL.createObjectURL(new Blob([wasm_bindgen.logo()], { type: "image/jpeg" }));
  $("logo").src = logoUrl; $("favicon").href = logoUrl; logoImg.src = logoUrl;

  SAMPLE = W().normalizeOld(SAMPLE);
  try { ta.value = W().normalizeOld(localStorage.getItem("han-text") || SAMPLE); } catch { ta.value = SAMPLE; }

  ime = new wasm_bindgen.HangulIme();
  renderKeyboard();
  renderOldKeys();
  let tab = 0;
  try { tab = Math.min(2, Math.max(0, +(localStorage.getItem("han-tab") || 0))); } catch {}
  setTab(tab);
  loadWebFont();
  update();
  ta.focus();
  // show the 예제문 from its first line; otherwise continue where the text ends
  const at = ta.value === SAMPLE ? 0 : ta.value.length;
  ta.setSelectionRange(at, at);
  if (!at) ta.scrollTop = 0;
})();
</script>
