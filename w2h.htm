        (w.notes.length ? `<div class="notes">${w.notes.map((n) => `<span>${esc(n)}</span>`).join("")}</div>` : "") + `</div>`).join("")
    : `<div class="none">글을 입력하면 낱말마다 어떻게 적히는지 보여 드려요.</div>`;
  $("words").querySelectorAll(".edit").forEach((b) => { b.onclick = () => editException(b.dataset.w, b.dataset.ko); });
  try { localStorage.setItem("swe2han-text-" + L.code, text); } catch {}
}

function insertText(t) {
  sv.focus();
  const s = sv.selectionStart, e = sv.selectionEnd;
  if (!document.execCommand("insertText", false, t)) sv.setRangeText(t, s, e, "end");
  update();
}

sv.addEventListener("input", update);

// ------------------------------------------------------------------
// Exception check: the user's own words, checked before the dictionary and the rules (Rust)
// ------------------------------------------------------------------
const exKey = (code) => "swe2han-ex-" + code;
function loadEx(code) { try { return JSON.parse(localStorage.getItem(exKey(code)) || "{}"); } catch { return {}; } }
function pushEx(code, map) { W().setExceptions(code, Object.entries(map).map(([w, k]) => `${w} = ${k}`).join("\n")); }
function saveEx(code, map) {
  try { localStorage.setItem(exKey(code), JSON.stringify(map)); } catch {}
  pushEx(code, map);
}

function editException(word, current) {
  const key = word.toLowerCase();
  const map = loadEx(L.code);
  const v = prompt(`"${word}" 을(를) 어떻게 적을까요?\n(옛한글은 붙여넣기 · 비우면 내 예외에서 지웁니다)`, map[key] ?? current);
  if (v === null) return;
  if (v.trim()) map[key] = v.trim(); else delete map[key];
  saveEx(L.code, map);
  update();
  renderExList();
  toast(v.trim() ? `"${word}" → ${v.trim()} 을(를) 내 예외에 저장했습니다` : `"${word}" 예외를 지웠습니다`);
}

function renderExList() {
  const map = loadEx(L.code), entries = Object.entries(map);
  $("exSummary").textContent = `내 예외 낱말 · ${L.name} ${entries.length}개`;
  $("exList").innerHTML = entries.length
    ? entries.map(([w, k]) => `<span class="exitem"><span dir="auto">${esc(w)}</span>→<b>${esc(k)}</b><button data-w="${esc(w)}" title="지우기">✕</button></span>`).join("")
    : `<span style="color:var(--faint);font-size:12.5px">아직 없어요. 낱말 풀이의 "고치기"로 만들 수 있어요.</span>`;
  $("exList").querySelectorAll("button[data-w]").forEach((b) => {
    b.onclick = () => { const m = loadEx(L.code); delete m[b.dataset.w]; saveEx(L.code, m); update(); renderExList(); };
  });
}

$("exExport").onclick = () => {
  const text = Object.entries(loadEx(L.code)).map(([w, k]) => `${w} = ${k}`).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text + "\n"], { type: "text/plain;charset=utf-8" }));
  a.download = `wrld2han_exceptions_${L.code}.txt`;
  document.body.append(a); a.click(); a.remove();
};
$("exImport").onclick = () => $("exFile").click();
$("exFile").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const map = loadEx(L.code);
  let n = 0;
  for (const line of (await f.text()).split(/\r?\n/)) {
    const m = line.match(/^(.+?)\s*(?:=|\t)\s*(.+)$/);
    if (m) { map[m[1].trim().toLowerCase()] = m[2].trim(); n++; }
  }
  saveEx(L.code, map); update(); renderExList();
  toast(`${n}개를 가져왔습니다`);
};

// ------------------------------------------------------------------
// Language tabs
// ------------------------------------------------------------------
function renderLangTabs() {
  $("langs").replaceChildren(...LANGS.map((l) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "lt"; b.setAttribute("role", "tab");
    b.dataset.code = l.code;
    b.title = `${l.name} · ${l.native}`;
    b.innerHTML = `${flagSvg(l.flag)}<span>${l.name}</span>`;
    b.onclick = () => setLang(l.code);
    return b;
  }));
}

function setLang(code, keepText = false) {
  L = LANGS.find((l) => l.code === code) || LANGS[0];
  document.querySelectorAll(".lt").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.code === L.code)));
  document.querySelector(`.lt[data-code="${L.code}"]`)?.scrollIntoView({ block: "nearest", inline: "nearest" });
  $("curLang").innerHTML = `${flagSvg(L.flag)}<span>${L.native}</span>`;
  $("langHint").textContent = L.hint;
  $("kbTitle").textContent = `${L.name.replace(/[\u302E\u302F]/g, "")}자판`;  // 듀ᇰ귁자판 · 방점 없이
  sv.lang = L.code;
  sv.placeholder = `${L.samples[0]}`;
  if (!keepText) {
    let t = null;
    try { t = localStorage.getItem("swe2han-text-" + L.code); } catch {}
    sv.value = t ?? L.samples[0];
  }
  try { localStorage.setItem("swe2han-lang", L.code); } catch {}
  pushEx(L.code, loadEx(L.code));
  renderExList();
  renderSamples();
  renderLegend();
  renderKeyboard();
  update();
  sv.focus();
}

// ------------------------------------------------------------------
// Samples & legend
// ------------------------------------------------------------------
function renderSamples() {
  $("samples").replaceChildren(...L.samples.map((s) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = s; b.dir = "auto";
    b.onclick = () => { sv.value = s; sv.focus(); update(); };
    return b;
  }));
}

function legendItems() {
  if (L.code === "sv") return SV_LEGEND;
  // letters actually produced by this language's samples, with the words that use them
  const words = L.samples.flatMap((s) => JSON.parse(W().explain(L.code, s)));
  const has = (ko, ch, big) => ko.includes(ch) || (big.length === 1 && ko.includes(big));
  return OLD_INFO.filter(([ch, big]) => words.some((w) => has(w.ko, ch, big))).map(([ch, big, name, ipa]) => ({
    big, name, ipa, src: "", desc: "",
    ex: [...new Set(words.filter((w) => has(w.ko, ch, big) && [...w.sv].length <= 14).map((w) => w.sv))].slice(0, 4),
  }));
}

function renderLegend() {
  const items = legendItems();
  $("legend").innerHTML = items.length ? items.map((l) => `
    <div class="lg">
      <div class="big">${l.big}</div>
      <div class="name">${l.name} <span class="ipa">${l.ipa}</span></div>
      ${l.src ? `<p><b>${l.src}</b> — ${l.desc}</p>` : ""}
      <div class="ex">${l.ex.map((w) => `<button data-w="${esc(w)}" dir="auto">${esc(w)}<b>${esc(tr(w))}</b></button>`).join("")}</div>
    </div>`).join("") : `<div class="none" style="color:var(--faint)">이 예문에는 옛한글 소리 글자가 없어요.</div>`;
  $("legend").querySelectorAll("button[data-w]").forEach((b) => {
    b.onclick = () => insertText((sv.value && !/\s$/.test(sv.value.slice(0, sv.selectionStart)) ? " " : "") + b.dataset.w);
  });
}

// ------------------------------------------------------------------
// Per-language keyboard (hint = Hangul sound value from Rust)
// ------------------------------------------------------------------
const CODES = [
  ["KeyQ", "KeyW", "KeyE", "KeyR", "KeyT", "KeyY", "KeyU", "KeyI", "KeyO", "KeyP", "BracketLeft", "BracketRight"],
  ["KeyA", "KeyS", "KeyD", "KeyF", "KeyG", "KeyH", "KeyJ", "KeyK", "KeyL", "Semicolon", "Quote", "Backslash"],
  ["KeyZ", "KeyX", "KeyC", "KeyV", "KeyB", "KeyN", "KeyM", "Comma", "Period", "Slash"],
];
let vShift = false, physShift = false;

function hintLabel(h) {
  if (!h) return "";
  const c = h[0];
  if (COMPAT[c]) return COMPAT[c];
  if (/[ᄀ-ᅟ]/.test(c)) return c + "ᅠ";
  return h;
}

function makeKey(ch, code) {
  const shift = vShift || physShift;
  const label = shift && !L.grid ? ch.toUpperCase() : ch;
  const combining = /^[̀-ͯऀ-ःऺ-ॏ]$/.test(ch);
  const shown = combining ? "◌" + ch : label;
  const hint = combining && L.code !== "hi" ? "" : W().keyHint(L.code, ch);
  const b = document.createElement("button");
  b.type = "button";
  b.className = "key" + (isOld(hint) ? " old" : "") + (combining ? " dead" : "");
  if (code) b.dataset.code = code;
  b.innerHTML = `<span class="l">${esc(shown)}</span><span class="h">${esc(hintLabel(hint))}</span>`;
  b.title = hint ? `${ch} → ${hint}` : ch;
  b.addEventListener("mousedown", (e) => e.preventDefault());
  b.addEventListener("click", () => { insertText(label); if (vShift) { vShift = false; renderKeyboard(); } });
  return b;
}

function renderKeyboard() {
  const kb = $("kb");
  kb.replaceChildren();
  const rows = L.rows.map((r) => [...r]);
  rows.forEach((row, ri) => {
    const r = document.createElement("div"); r.className = "row";
    const last = ri === rows.length - 1;
    if (last && !L.grid) r.append(fnKey("⇧ Shift", "ShiftLeft", vShift, () => { vShift = !vShift; renderKeyboard(); }));
    row.forEach((ch, ci) => r.append(makeKey(ch, L.grid ? null : CODES[ri]?.[ci])));
    if (last) r.append(fnKey("⌫", "Backspace", false, () => {
      sv.focus();
      const s = sv.selectionStart, e = sv.selectionEnd;
      if (s !== e) sv.setRangeText("", s, e, "end");
      else if (s > 0) sv.setRangeText("", s - 1, s, "end");
      update();
    }));
    kb.append(r);
  });
  const extra = [...(Array.isArray(L.extra) ? L.extra : [...(L.extra || "")]), ...(L.tones || [])];
  if (extra.length) {
    const r = document.createElement("div"); r.className = "row extra";
    extra.forEach((ch) => r.append(makeKey(ch, null)));
    kb.append(r);
  }
  const r = document.createElement("div"); r.className = "row";
  r.append(fnKey("Space", "Space", false, () => insertText(" "), "space"));
  r.append(fnKey("⏎ Enter", "Enter", false, () => insertText("\n")));
  kb.append(r);
}

function fnKey(label, code, on, onClick, extra = "wide") {
  const b = document.createElement("button");
  b.type = "button"; b.className = `key fn ${extra}${on ? " on" : ""}`; b.dataset.code = code;
  b.innerHTML = `<span class="l">${label}</span>`;
  b.addEventListener("mousedown", (e) => e.preventDefault());
  b.addEventListener("click", onClick);
  return b;
}

addEventListener("keydown", (e) => {
  document.querySelector(`.key[data-code="${e.code}"]`)?.classList.add("down");
  if (e.key === "Shift" && !physShift) { physShift = true; renderKeyboard(); }
});
addEventListener("keyup", (e) => {
  document.querySelector(`.key[data-code="${e.code}"]`)?.classList.remove("down");
  if (e.key === "Shift") { physShift = false; renderKeyboard(); }
});
addEventListener("blur", () => { document.querySelectorAll(".key.down").forEach((k) => k.classList.remove("down")); if (physShift) { physShift = false; renderKeyboard(); } });

// ------------------------------------------------------------------
// Web font: wrld2hanfont.wasm (Rust) → FontFace
// ------------------------------------------------------------------
let fontFamily = null;
async function loadWebFont() {
  const msg = $("fontMsg");
  try {
    const res = await fetch("wrld2hanfont.wasm?v=ca50d161adda");
    if (!res.ok) throw new Error("HTTP " + res.status);
    let inst;
    try { inst = (await WebAssembly.instantiateStreaming(res.clone(), {})).instance; }
    catch { inst = (await WebAssembly.instantiate(await res.arrayBuffer(), {})).instance; }
    const ex = inst.exports;
    // read ptr/len first: the first call may grow wasm memory and detach an earlier `memory.buffer`
    const blob = (id) => { const ptr = ex.blob_ptr(id), len = ex.blob_len(id); return new Uint8Array(ex.memory.buffer, ptr, len).slice(); };
    const meta = JSON.parse(new TextDecoder().decode(blob(0)));
    let bytes = 0;
    for (const face of meta.faces) {
      const data = blob(face.id);
      bytes += data.length;
      const ff = new FontFace(meta.family, data, { weight: face.weight, unicodeRange: meta.unicodeRange, display: "swap" });
      document.fonts.add(await ff.load());
    }
    fontFamily = meta.family;
    const license = URL.createObjectURL(new Blob([blob(meta.licenseId)], { type: "text/plain;charset=utf-8" }));
    msg.innerHTML = `옛한글 웹 글꼴 적용됨 — ${meta.source} · ${(bytes / 1024 / 1024).toFixed(1)}MB (wrld2hanfont.wasm) · <a href="${license}" target="_blank" rel="noopener">라이선스</a>`;
    $("fontInfo").classList.add("ok");
  } catch (err) {
    msg.textContent = "웹 글꼴을 불러오지 못해 시스템 글꼴을 사용합니다 (" + err.message + ") — PNG 내보내기를 이용하세요";
  }
}

// ------------------------------------------------------------------
// PNG export: Hangul with the original under each word (ruby style)
// ------------------------------------------------------------------
const logoImg = new Image();

async function exportPng() {
  const text = sv.value.trim();
  if (!text) return toast("먼저 글을 입력하세요", true);
  const HAN = `${fontFamily ? `"${fontFamily}", ` : ""}"Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  const UI = getComputedStyle(document.documentElement).getPropertyValue("--font").trim() || "sans-serif";
  try { await document.fonts.load(`40px ${HAN}`, "ᄫᅡᆺ 한"); } catch {}

  const Wd = 1400, P = 64, KO = 44, SV = 17, GAPX = 22, LINE = KO + SV + 34;
  const m = document.createElement("canvas").getContext("2d");
  // lines → words → blocks {ko, sv, w}; Chinese has no spaces, so split its Hangul by the output words
  const layout = [];
  for (const para of text.split("\n")) {
    const pieces = para.split(/\s+/).filter(Boolean);
    const blocks = pieces.map((sw) => {
      const k = tr(sw);
      m.font = `400 ${KO}px ${HAN}`; const kw = m.measureText(k).width;
      m.font = `500 ${SV}px ${UI}`; const sw2 = m.measureText(sw).width;
      return { ko: k, sv: sw, w: Math.max(kw, sw2) };
    });
    let line = [], x = 0;
    for (const b of blocks) {
      if (line.length && x + b.w > Wd - P * 2) { layout.push(line); line = []; x = 0; }
      line.push(b); x += b.w + GAPX;
    }
    layout.push(line);
  }
  const headH = 130, footH = 70;
  const H = headH + layout.length * LINE + footH;
  const scale = 2;
  const cv = document.createElement("canvas");
  cv.width = Wd * scale; cv.height = H * scale;
  const ctx = cv.getContext("2d");
  ctx.scale(scale, scale);
  const rtl = L.code === "ar";

  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, Wd, H);
  const g = ctx.createLinearGradient(0, 0, Wd, 0);
  g.addColorStop(0, "#1d5fa8"); g.addColorStop(.5, "#f2b705"); g.addColorStop(1, "#7c3aed");
  ctx.fillStyle = g; ctx.fillRect(0, 0, Wd, 6);

  if (logoImg.complete && logoImg.naturalWidth) {
    ctx.save(); roundRect(ctx, P, 36, 56, 56, 14); ctx.clip(); ctx.drawImage(logoImg, P, 36, 56, 56); ctx.restore();
  }
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#0f172a"; ctx.font = `700 24px ${UI}`; ctx.fillText("WRLD2HAN", P + 74, 62);
  ctx.fillStyle = "#64748b"; ctx.font = `14px ${HAN}`; ctx.fillText(`${L.native} → 옛한글 (${L.name})`, P + 74, 86);
  ctx.textAlign = "right"; ctx.fillStyle = "#94a3b8"; ctx.font = `13px ${UI}`;
  ctx.fillText(new Date().toISOString().slice(0, 10), Wd - P, 70);
  ctx.textAlign = "left";

  let y = headH + KO;
  for (const line of layout) {
    let x = rtl ? Wd - P : P;
    for (const b of line) {
      if (rtl) x -= b.w;
      ctx.fillStyle = "#0f172a"; ctx.font = `400 ${KO}px ${HAN}`;
      ctx.fillText(b.ko, x, y);
      ctx.fillStyle = "#1d5fa8"; ctx.font = `500 ${SV}px ${UI}`;
      ctx.fillText(b.sv, x, y + SV + 12);
      x = rtl ? x - GAPX : x + b.w + GAPX;
    }
    y += LINE;
  }
  ctx.fillStyle = "#e5e8f0"; ctx.fillRect(P, H - footH + 10, Wd - P * 2, 1);
  ctx.fillStyle = "#94a3b8"; ctx.font = `12px ${HAN}`;
  const used = OLD_INFO.filter(([ch]) => layout.some((ln) => ln.some((b) => b.ko.includes(ch)))).map(([, big, , ipa]) => `${big} ${ipa}`);
  ctx.fillText(`${used.join(" · ")}${used.length ? "   —   " : ""}글꼴: Noto Sans CJK KR (SIL OFL 1.1)`, P, H - footH + 40);

  const name = `wrld2han_${L.code}_${new Date().toISOString().slice(0, 10)}.png`;
  cv.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
  toast(`${name} 저장`);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ------------------------------------------------------------------
// Toolbar
// ------------------------------------------------------------------
let toastTimer;
function toast(msg, err = false) {
  const t = $("toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast" + (err ? " err" : "")), 2200);
}

$("btnCopy").onclick = async () => {
  const t = ko.textContent;
  if (!t) return toast("복사할 내용이 없습니다", true);
  try { await navigator.clipboard.writeText(t); } catch {
    const r = document.createRange(); r.selectNodeContents(ko);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); s.removeAllRanges();
  }
  toast("옛한글을 복사했습니다");
};
$("btnPng").onclick = () => exportPng().catch((e) => toast(e.message, true));
$("btnTheme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("swe2han-theme", root.dataset.theme); } catch {}
};
try { const t = localStorage.getItem("swe2han-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

// ------------------------------------------------------------------
// Boot
// ------------------------------------------------------------------
(async () => {
  try {
    await wasm_bindgen({ module_or_path: "wrld2han.wasm?v=6327a198f102" });
  } catch (err) {
    $("sub").textContent = "wrld2han.wasm을 불러오지 못했습니다 — 웹 서버(http://)로 열어 주세요";
    $("sub").style.color = "#ef4444";
    toast("wrld2han.wasm 로드 실패: " + err.message, true);
    return;
  }
  const logoUrl = URL.createObjectURL(new Blob([W().logo()], { type: "image/jpeg" }));
  $("logo").src = logoUrl; $("favicon").href = logoUrl; logoImg.src = logoUrl;

  ready = true;
  // migrate the text saved by the Swedish-only version
  try {
    const old = localStorage.getItem("swe2han-text");
    if (old != null && localStorage.getItem("swe2han-text-sv") == null) localStorage.setItem("swe2han-text-sv", old);
  } catch {}
  renderLangTabs();
  let code = "sv";
  try { code = new URLSearchParams(location.search).get("lang") || localStorage.getItem("swe2han-lang") || "sv"; } catch {}
  setLang(code);
  sv.setSelectionRange(sv.value.length, sv.value.length);
  loadWebFont();
})();
